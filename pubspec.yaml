name: music_practice_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 核心功能套件 (最終確認版)
  file_picker: ^8.0.0
  path_provider: ^2.1.3
  flutter_midi_pro: ^3.1.4     # <--- 專注於 MIDI 鋼琴演奏

  # 導覽與 UI 套件
  go_router: ^14.2.0
  flutter_vector_icons: ^2.0.0
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ # <--- 宣告整個 assets 資料夾