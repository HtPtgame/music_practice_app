name: music_practice_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 核心功能套件 (最終確認版)
  file_picker: ^8.0.0
  flutter_midi_pro: ^3.1.4     # <--- 專注於 MIDI 鋼琴演奏
  path_provider: ^2.1.5

  # 導覽與 UI 套件
  go_router: ^14.2.0
  flutter_vector_icons: ^2.0.0
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  flutter_sound: ^9.28.0
  permission_handler: ^12.0.1
  open_file: ^3.3.2  # 用於開啟檔案/資料夾
  tflite_flutter: ^0.11.0  # AI 模型推論引擎
  record: ^6.1.1  # 升級修正 linux 平台未實作 startStream 問題
  shared_preferences: ^2.3.2  # 本地儲存套件

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ # <--- 宣告整個 assets 資料夾
    - assets/onsets_frames_wavinput.tflite # 明確指定 AI 模型檔案
    - assets/TimGM6mb.sf2 # 明確指定 SoundFont 檔案